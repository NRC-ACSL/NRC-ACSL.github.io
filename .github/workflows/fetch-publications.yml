name: Refresh publications from Google Scholar

on:
  schedule:
    # Daily at 11:07 UTC = 6:07 AM Eastern (EST). Minute offset from :00 to dodge
    # GitHub's top-of-hour scheduler congestion. Cron is fixed UTC, so during EDT
    # (summer) this lands at 7:07 AM Eastern.
    - cron: '7 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch publications from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npm run pubs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/content/publications.yaml; then
            echo "No changes to publications.yaml."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/publications.yaml
            git commit -m "chore: refresh publications from Google Scholar"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
